<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Orders | Like Dealer admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; upgrade-insecure-requests" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Passion+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <link rel="icon" href="/favicon/safari-pinned-tab.svg" />
</head>
<body class="page-admin" data-page="admin-orders">
  <header class="admin-top">
    <div>
      <p class="admin-brand">Like Dealer</p>
      <h1>Orders</h1>
      <nav class="admin-nav" aria-label="Admin">
        <a href="/admin/products/">Products</a>
        <a href="/admin/orders/" aria-current="page">Orders</a>
      </nav>
    </div>
    <div class="admin-top__actions">
      <span id="admin-user"></span>
      <button type="button" class="btn btn--secondary" id="admin-signout">Sign out</button>
    </div>
  </header>
  <p id="admin-banner" class="admin-banner" hidden></p>
  <section class="admin-orders">
    <div id="admin-order-filters" class="admin-filters"></div>
    <div class="admin-orders__pager" id="admin-order-pager"></div>
    <div class="admin-split admin-split--orders">
      <div class="admin-table-wrap" id="admin-order-table"></div>
      <section id="admin-order-detail" aria-label="Order detail"></section>
    </div>
  </section>
  <script type="module" src="/js/admin/orders-page.js"></script>
</body>
</html>

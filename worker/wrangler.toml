name = "likedealer-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
SITE_URL = "https://like-dealer.com"
MARKUP_MULTIPLIER = "2"
SOCIAL_PANEL_API_URL = "https://socialpanel24.com/api/v2"
ORDERS_API_URL = "https://script.google.com/macros/s/AKfycby3Yg1NEsipYEyQi6Oarl_h5C4-rr40dPQwP9LLttlN-EwTgyynojaHAR7CCjodgyZrvg/exec"
FROM_NAME = "LikeDealer"

[[kv_namespaces]]
binding = "ORDERS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (wrangler secret put):
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# SOCIAL_PANEL_API_KEY
# MAILERSEND_API_TOKEN
# OWNER_EMAIL
# FROM_EMAIL
